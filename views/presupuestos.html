<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mBm - Presupuesto</title>
    <link rel="shortcut icon" href="../mBm.png" type="image/png">
    <link rel="stylesheet" href="../css/presupuestos.css">
</head>
<body>

    <div class="nav">
        <img src="../assets/img/mBm.png" alt="logo mBm">
        <h1>mBm</h1>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./productos.html">Productos</a></li>
            <li><a href="#" class="activo">Presupuestos</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
        </ul>
    </div>

    <main class="main-container">
        <section class="presupuesto-section">
            <h2>Solicita tu Presupuesto</h2>
            
            <form action="#" method="POST" class="form-presupuesto">
                
                <div class="grupo-campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="grupo-campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="600123456" title="Debe tener 9 dígitos numéricos" pattern="[0-9]{9}" required>
                </div>

                <div class="grupo-campo">
                    <label for="mensaje">Solicite más Información</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos los detalles de tu proyecto o el hardware que buscas..." required></textarea>
                </div>

                <div class="grupo-checkbox">
                    <input type="checkbox" id="politica" name="politica" required>
                    <label for="politica">Acepto la <a href="#">Política de privacidad</a></label>
                </div>

                <button type="submit" class="btn-enviar">Enviar Presupuesto</button>
            </form>
        </section>
    </main>

</body>
</html>
